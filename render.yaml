# Render Blueprint: one long-lived Node service runs the Colyseus game server AND serves the built
# web client (WebSockets need a persistent process — no serverless). Free plan to start; switch
# `plan` to `starter` for an always-on server (no cold starts, live rooms survive idle periods).
services:
  - type: web
    name: dascade
    runtime: node
    plan: free
    # pnpm is pinned to package.json "packageManager". NODE_ENV is NOT set at build time (dev
    # dependencies are needed to build); the start command sets production itself.
    buildCommand: npx --yes pnpm@11.27.1 install --frozen-lockfile && npx --yes pnpm@11.27.1 build
    startCommand: cd apps/game-server && NODE_ENV=production node --enable-source-maps dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      # Enables DASQuest checkpoint saves. Render generates a random 32+ char value.
      - key: DASCADE_SAVE_SECRET
        generateValue: true
